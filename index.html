<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#dce8dd">
    <title>Menagerie</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="Animal stacking game"></canvas>
      <div id="hud" aria-label="Game controls">
        <button id="sound-toggle" class="round-control hud-toggle" type="button" aria-pressed="true" aria-label="Turn sound off" title="Turn sound off">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="sound-speaker" d="M4 9v6h4l5 4V5L8 9H4Z"/>
            <path class="sound-wave toggle-on" d="M16 8.2a5 5 0 0 1 0 7.6M18.6 5.7a8.5 8.5 0 0 1 0 12.6"/>
            <path class="toggle-off" d="m16.2 8.3 5.5 7.4m0-7.4-5.5 7.4"/>
          </svg>
        </button>
        <output id="score" class="round-control" aria-label="Score">0</output>
        <button id="loops-toggle" class="round-control hud-toggle" type="button" aria-pressed="false" aria-label="Turn bubble loops on" title="Turn bubble loops on">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"/>
            <path class="toggle-on" d="M3.7 12h16.6M12 3.5c2.8 2.7 2.8 14.3 0 17M12 3.5c-2.8 2.7-2.8 14.3 0 17"/>
            <path class="toggle-off" d="m5.8 5.8 12.4 12.4"/>
          </svg>
        </button>
      </div>
      <button id="drop" class="round-control" type="button" hidden disabled aria-label="Play again" title="Play again">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.4 7.2A8 8 0 1 0 20 14h-2.2a5.8 5.8 0 1 1-.6-4.9L14 12.3h7V5.2l-1.6 2Z"/>
        </svg>
      </button>
      <button id="share-trace" type="button" hidden>Share trace</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
