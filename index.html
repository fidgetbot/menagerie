<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#dce8dd">
    <title>Menagerie</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="Animal stacking game"></canvas>
      <output id="score" aria-label="Score">0</output>
      <aside id="tutorial" aria-label="How to play">
        <p class="goal">Stack the animals as high as you can.<br>Don’t let any fall.</p>
      </aside>
      <section id="game-over" class="hidden" role="alert" aria-live="assertive">
        <p>Game over</p>
        <button id="play-again" type="button">Play again</button>
      </section>
      <button id="drop" type="button" disabled>Drop</button>
      <button id="restart" type="button" aria-label="Restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
      </button>
      <button id="share-trace" type="button" hidden>Share trace</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
